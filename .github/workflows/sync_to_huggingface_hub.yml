name: Sync to Hugging Face hub

on:
  push:
    branches: [LEON]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false

      - name: Create models folder
        run: mkdir -p movie-recommendation-system/models

      - name: Debug - List files before TMDB check
        run: |
          ls -lR
      
      - name: Fail if TMDB file is present
        run: |
          if [ -f data/TMDB_movie_dataset_v11.csv ]; then
            echo "TMDB file detected! Aborting push."
            exit 1
          fi

      - name: Prepare files for Hugging Face push (exclude TMDB)
        run: |
            rsync -av --exclude='data/TMDB_movie_dataset_v11.csv' . output_dir/


      - name: Download movies.pkl from Google Drive
        run: |
          FILE_ID="1VI5hdOLksCINWPMa2Fv1hvHJqwJTGbdl"
          FILE_NAME="movies.pkl"
          wget --no-check-certificate "https://drive.google.com/uc?export=download&id=${FILE_ID}" -O movie-recommendation-system/models/${FILE_NAME}

      
      - name: Download vectorizer.pkl from Google Drive
        run: |
          FILE_ID="1FhaNY392iX-U5g8aUKR_73sE0Uq_QSbk"  # Replace with actual ID
          FILE_NAME="vectorizer.pkl"
          wget --no-check-certificate "https://drive.google.com/uc?export=download&id=${FILE_ID}" -O movie-recommendation-system/models/${FILE_NAME}

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://SFG006:$HF_TOKEN@huggingface.co/spaces/SFG006/Illustrious-films LEON
